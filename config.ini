# ============================================================
# gb28181-ipc-lab 配置文件
# ============================================================
# 格式：key = value
#   - 每行一个键；大小写敏感（键名与 gb_config_t 字段一一对应）
#   - '#' 或 ';' 之后的内容算注释（值里不能出现这两个字符）
#   - 行首是 '#' 或 ';' 的整行都是注释
#   - 未知键只告警，不影响启动
#   - 数值越界/非数字会直接报错并指出行号（宁可起不来，也不要带错配置跑）
#   - fifo_path 为空 = 文件循环模式；用 -live <path> 启动时命令行会覆盖它
#
# 命令行：gb28181_device [-c 配置文件] [-live <FIFO路径>]
# 环境变量：GB_CONFIG 指定配置文件；GB_LOG=debug|info|warn|error 覆盖日志级别
# ============================================================

# ---------- SIP 信令 ----------

# 平台（SIP 服务器）地址。WVP / ZLMediaKit 部署时这里填平台的 IP。
server_ip = 192.168.0.197

# 平台 SIP 端口，国标默认 5060
server_port = 5060

# 设备本地 SIP 端口。设备主动注册，端口随意但要避开 5060（平台的）。
# 调试时反复重启这个端口会短暂处于 TIME_WAIT，代码里已设 SO_REUSEADDR 兜底。
local_port = 5061

# 设备国标编码：必须 20 位数字，否则平台只会回一个含糊的 403/400。
# 前 6 位是行政区划码（GB/T 2260），8~10 位是行业/类型码，13 位后是序号。
device_id = 34020000001320000001

# SIP Digest 鉴权密码（平台侧设备配置里填的是同一个值）
device_pwd = 12345678

# 平台国标编码：同样 20 位数字
platform_id = 44030000002000000001

# SIP 域：通常是平台编码的前 10 位。REGISTER 的请求 URI 是 sip:<平台编码>@<域>
domain = 4403000000

# 通道编码：单通道设备通常等于设备 ID（留空则自动取 device_id）
channel_id = 34020000001320000001

# 设备显示名，UTF-8。会出现在 Catalog / DeviceInfo 的 <Name>/<DeviceName> 里。
# XML 声明统一用 UTF-8（GB_MANSCDP_XML_DECL），所以中文不会再乱码。
device_name = TS模拟摄像头

# ---------- 媒体 ----------

# RTP 载荷类型。PS over RTP 必须用动态类型 96~127（SDP 里用 a=rtpmap 声明）
rtp_pt = 96

# 单个 RTP 包的载荷上限（= 分片长度）。
# 1400 + 20(IP) + 8(UDP) + 12(RTP) = 1440 < 1500，不会触发 IP 分片。
# 调大能少发几个包，但在有隧道/VPN 的网络上容易整包丢掉。
mtu = 1400

# 帧率。决定两件事：推流节奏（1/fps）和 PTS 步进（90000/fps；15fps → 6000）
fps = 15

# SDP 的 y= 行没有给出 SSRC 时用的默认值。这个值会出现在 SDP 和 RTP 头里，
# 接收端用它区分不同的码流。十六进制（0x...）或十进制都可以。
ssrc_default = 0x12345678

# 文件循环模式的 H.264 裸流（AnnexB）路径。整文件读进内存循环推送，
# 不依赖任何外部进程，适合验证 PS/RTP 封装是否正确。
# 默认指向仓库自带的码流（由 tools/gen_teststream.sh 生成），
# 与 README 的快速开始一致；相对路径按「启动时的工作目录」解析，
# 所以请在项目根目录下启动。
h264_file = assets/testsrc.h264

# 实时流模式的命名管道。留空 = 文件循环模式。
# 非空时（或用 -live <path> 启动）从该 FIFO 流式读 H.264：
#   宿主侧：ffmpeg -f v4l2 -i /dev/video0 -c:v libx264 -tune zerolatency \
#                   -f h264 - > /path/to/fifo
# 打开 FIFO 会阻塞到写端出现（POSIX 语义），之后按 NAL 切帧、锚定 SPS 保证首帧是 IDR。
fifo_path =

# ---------- 音频 ----------

# 1 = 在 PS 里复用 G.711A 音频（国标做法：不单独开音频 RTP 流）。
# 音频由程序合成的 1kHz 正弦波经 A-law 编码产生（模拟麦克风），
# 与视频共用同一个 90kHz 时钟，每帧 20ms → PTS 步进 1800。
audio_enable = 1

# SDP 里 audio 的载荷类型：8 = PCMA（G.711A，静态类型）
audio_pt = 8

# G.711A 固定 8kHz 单声道；改了这里会被忽略（只告警）
audio_rate = 8000
audio_channels = 1

# ---------- 行为 ----------

# 心跳（Keepalive）周期，秒。平台据此判断设备在线，一般 30~60 秒。
heartbeat_s = 60

# 注册有效期，秒。到期前必须重新 REGISTER，程序在有效期过半时自动续注册。
expires = 3600

# 日志级别：0=error 1=warn 2=info 3=debug
# 环境变量 GB_LOG 优先级更高（现场排障不用改配置文件）
log_level = 2
